<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist Test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      line-height: 1.45;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef1f5;
      color: #111;
    }

    main {
      width: min(900px, 100%);
      margin: 0 auto;
      background: #fff;
      min-height: 100vh;
    }

    header {
      padding: 28px 24px;
      background: #111;
      color: #fff;
      border-top: 12px solid #d71920;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 7vw, 3.25rem);
      line-height: 1;
      text-transform: uppercase;
    }

    header p,
    .instructions p {
      margin: 8px 0 0;
    }

    .instructions {
      padding: 22px 24px;
      background: #ffe24a;
      border-bottom: 6px solid #111;
    }

    .instructions strong {
      display: block;
      font-size: 1.2rem;
    }

    .progress-wrap {
      padding: 22px 24px;
      background: #fff;
    }

    .progress-label {
      margin-bottom: 8px;
      font-weight: 800;
    }

    .progress-track {
      height: 30px;
      overflow: hidden;
      background: #d6d6d6;
      border: 3px solid #111;
      border-radius: 999px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: #14883b;
      transition: width 180ms ease;
    }

    .steps {
      display: grid;
      gap: 14px;
      padding: 0 24px 24px;
    }

    .step {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 16px;
      align-items: start;
      padding: 22px;
      border: 4px solid #111;
      border-radius: 12px;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    .step:nth-child(1) {
      background: #cdeaff;
    }

    .step:nth-child(2) {
      background: #ffd2e1;
    }

    .step:nth-child(3) {
      background: #d8f5c6;
    }

    .step:hover {
      transform: translateY(-2px);
    }

    .step.done {
      background: #b8efc6;
      border-color: #126d31;
    }

    .step input {
      width: 38px;
      height: 38px;
      margin: 3px 0 0;
      accent-color: #126d31;
      cursor: pointer;
    }

    .english {
      display: block;
      font-weight: 800;
      font-size: 1.15rem;
    }

    .spanish {
      display: block;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 2px solid rgba(0, 0, 0, 0.35);
    }

    .complete {
      display: none;
      margin: 0 24px 24px;
      padding: 24px;
      background: #111;
      color: #fff;
      border: 8px solid #14883b;
      text-align: center;
      font-weight: 900;
      font-size: 1.4rem;
    }

    .complete.show {
      display: block;
    }

    .reset-area {
      padding: 20px 24px 32px;
      background: #e8e8e8;
      text-align: center;
    }

    button {
      padding: 12px 18px;
      border: 3px solid #111;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: #111;
      color: #fff;
    }

    @media (max-width: 560px) {
      :root {
        font-size: 18px;
      }

      .step {
        grid-template-columns: 42px 1fr;
        padding: 18px 14px;
      }

      .step input {
        width: 34px;
        height: 34px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Checklist Test</h1>
      <p>Prueba de la lista</p>
    </header>

    <section class="instructions">
      <strong>This is only a test. You do not need to turn anything in.</strong>
      <p>Esta es solo una prueba. No necesitas entregar nada.</p>
    </section>

    <section class="progress-wrap" aria-live="polite">
      <div class="progress-label" id="progress-label">0 of 3 finished / 0 de 3 terminados</div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" aria-labelledby="progress-label">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </section>

    <section class="steps" aria-label="Checklist steps">
      <label class="step">
        <input type="checkbox" data-step="1">
        <span>
          <span class="english">1. Check this box.</span>
          <span class="spanish">1. Marca esta casilla.</span>
        </span>
      </label>

      <label class="step">
        <input type="checkbox" data-step="2">
        <span>
          <span class="english">2. Refresh this page. If the first box is still checked, check this box.</span>
          <span class="spanish">2. Actualiza esta página. Si la primera casilla sigue marcada, marca esta casilla.</span>
        </span>
      </label>

      <label class="step">
        <input type="checkbox" data-step="3">
        <span>
          <span class="english">3. Close this assignment. Open it again. If the first two boxes are still checked, check this box.</span>
          <span class="spanish">3. Cierra esta tarea. Ábrela de nuevo. Si las dos primeras casillas siguen marcadas, marca esta casilla.</span>
        </span>
      </label>
    </section>

    <section class="complete" id="complete-message" aria-live="polite">
      TEST FINISHED<br>
      PRUEBA TERMINADA
    </section>

    <section class="reset-area">
      <button type="button" id="reset-button">Start this test over / Reiniciar esta prueba</button>
    </section>
  </main>

  <script>
    (() => {
      const storageKey = "sweston-checklist-storage-test-v1";
      const boxes = Array.from(document.querySelectorAll("input[type='checkbox']"));
      const progressBar = document.getElementById("progress-bar");
      const progressTrack = document.querySelector(".progress-track");
      const progressLabel = document.getElementById("progress-label");
      const completeMessage = document.getElementById("complete-message");
      const resetButton = document.getElementById("reset-button");

      function readState() {
        try {
          return JSON.parse(localStorage.getItem(storageKey)) || {};
        } catch (_error) {
          return {};
        }
      }

      function saveState() {
        const state = {};
        boxes.forEach((box) => {
          state[box.dataset.step] = box.checked;
        });
        localStorage.setItem(storageKey, JSON.stringify(state));
      }

      function updateScreen() {
        const finished = boxes.filter((box) => box.checked).length;
        boxes.forEach((box) => {
          box.closest(".step").classList.toggle("done", box.checked);
        });
        progressLabel.textContent = `${finished} of ${boxes.length} finished / ${finished} de ${boxes.length} terminados`;
        progressBar.style.width = `${(finished / boxes.length) * 100}%`;
        progressTrack.setAttribute("aria-valuenow", String(finished));
        completeMessage.classList.toggle("show", finished === boxes.length);
      }

      const saved = readState();
      boxes.forEach((box) => {
        box.checked = saved[box.dataset.step] === true;
        box.addEventListener("change", () => {
          saveState();
          updateScreen();
        });
      });

      resetButton.addEventListener("click", () => {
        boxes.forEach((box) => {
          box.checked = false;
        });
        saveState();
        updateScreen();
      });

      updateScreen();
    })();
  </script>
</body>
</html>
